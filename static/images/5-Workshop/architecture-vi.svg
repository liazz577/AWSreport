<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker>
    <style>
      .n{font-size:14px;font-weight:700;fill:#232F3E}
      .s{font-size:12px;fill:#545b64}
      .l{font-size:12.5px;fill:#232F3E}
      .lg{font-size:12.5px;fill:#545b64}
      .q{stroke:#232F3E;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .i{stroke:#6b7785;stroke-width:1.6;fill:none;stroke-dasharray:7 5;marker-end:url(#g)}
      .d{stroke:#6b7785;stroke-width:1.4;fill:none;stroke-dasharray:2 4}
      .lb{fill:#ffffff}
      .glyph{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#ffffff"/>

  <!-- AWS Cloud -->
  <rect x="185" y="20" width="1195" height="815" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <rect x="185" y="20" width="34" height="30" fill="#232F3E"/>
  <text x="202" y="40" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">aws</text>
  <text x="228" y="40" font-size="14" fill="#232F3E">AWS Cloud</text>

  <!-- Region -->
  <rect x="210" y="65" width="1145" height="745" fill="none" stroke="#147EBA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="210" y="65" width="28" height="26" fill="#147EBA"/>
  <path d="M219,85 V71 h9 l-2,3 2,3 h-9" fill="#fff"/>
  <text x="246" y="83" font-size="14" fill="#147EBA">Region: US East (N. Virginia) us-east-1</text>

  <!-- ===== People ===== -->
  <g transform="translate(95,300)">
    <circle cx="-12" cy="-22" r="10" fill="none" stroke="#232F3E" stroke-width="2.5"/>
    <path d="M-34,12 q0,-22 22,-22 q22,0 22,22" fill="none" stroke="#232F3E" stroke-width="2.5"/>
    <circle cx="14" cy="-26" r="10" fill="none" stroke="#232F3E" stroke-width="2.5"/>
    <path d="M10,-6 q26,-4 28,18" fill="none" stroke="#232F3E" stroke-width="2.5"/>
    <text y="40" text-anchor="middle" class="n">Sinh viên</text>
    <text y="57" text-anchor="middle" class="s">trình duyệt web</text>
  </g>
  <g transform="translate(95,665)">
    <circle cx="0" cy="-22" r="11" fill="none" stroke="#232F3E" stroke-width="2.5"/>
    <path d="M-22,14 q0,-24 22,-24 q22,0 22,24" fill="none" stroke="#232F3E" stroke-width="2.5"/>
    <text y="40" text-anchor="middle" class="n">Quản trị viên</text>
    <text y="57" text-anchor="middle" class="s">CloudShell · deploy.sh</text>
  </g>

  <!-- ===== Service icons (72x72) ===== -->
  <!-- S3 web -->
  <g transform="translate(360,170)">
    <rect x="-36" y="-36" width="72" height="72" fill="#7AA116"/>
    <path class="glyph" d="M-18,-14 h36 l-5,32 h-26 z M-18,-14 q18,9 36,0"/>
    <text y="56" text-anchor="middle" class="n">Amazon S3</text>
    <text y="73" text-anchor="middle" class="s">website tĩnh (index.html)</text>
  </g>
  <!-- API Gateway -->
  <g transform="translate(360,400)">
    <rect x="-36" y="-36" width="72" height="72" fill="#8C4FFF"/>
    <path class="glyph" d="M-10,-14 l-12,14 12,14 M10,-14 l12,14 -12,14 M4,-18 l-8,36"/>
    <text y="56" text-anchor="middle" class="n">Amazon API Gateway</text>
    <text y="73" text-anchor="middle" class="s">HTTP API · POST /ask</text>
  </g>
  <!-- Lambda -->
  <g transform="translate(650,400)">
    <rect x="-36" y="-36" width="72" height="72" fill="#ED7100"/>
    <path class="glyph" d="M-16,20 l14,-26 M-12,-20 h8 l20,40 h6"/>
    <text y="56" text-anchor="middle" class="n">AWS Lambda</text>
    <text y="73" text-anchor="middle" class="s">studymate-ask (Python)</text>
  </g>
  <!-- CloudWatch -->
  <g transform="translate(650,170)">
    <rect x="-36" y="-36" width="72" height="72" fill="#E7157B"/>
    <path class="glyph" d="M-20,14 l10,-12 8,8 12,-16 10,8"/><circle class="glyph" cx="0" cy="0" r="22"/>
    <text y="56" text-anchor="middle" class="n">Amazon CloudWatch</text>
    <text y="73" text-anchor="middle" class="s">log &amp; giám sát</text>
  </g>
  <!-- IAM -->
  <g transform="translate(650,610)">
    <rect x="-36" y="-36" width="72" height="72" fill="#DD344C"/>
    <rect class="glyph" x="-20" y="-14" width="40" height="28" rx="3"/><circle class="glyph" cx="-8" cy="0" r="5"/><path class="glyph" d="M4,-4 h10 M4,5 h10"/>
    <text y="56" text-anchor="middle" class="n">IAM Role</text>
    <text y="73" text-anchor="middle" class="s">role cho Lambda và Knowledge Base</text>
  </g>
  <!-- Knowledge Base -->
  <g transform="translate(950,400)">
    <rect x="-36" y="-36" width="72" height="72" fill="#01A88D"/>
    <circle class="glyph" cx="-12" cy="-10" r="5"/><circle class="glyph" cx="12" cy="-12" r="5"/><circle class="glyph" cx="0" cy="14" r="5"/>
    <path class="glyph" d="M-7,-10 h14 M-9,-6 l7,15 M9,-8 l-7,17"/>
    <text y="56" text-anchor="middle" class="n">Amazon Bedrock</text>
    <text y="73" text-anchor="middle" class="s">Knowledge Base (RAG)</text>
  </g>
  <!-- Nova Lite -->
  <g transform="translate(1220,170)">
    <rect x="-36" y="-36" width="72" height="72" fill="#01A88D"/>
    <path class="glyph" d="M0,-22 q3,19 22,22 q-19,3 -22,22 q-3,-19 -22,-22 q19,-3 22,-22 z"/>
    <text y="56" text-anchor="middle" class="n">Amazon Nova Lite</text>
    <text y="73" text-anchor="middle" class="s">LLM viết câu trả lời</text>
  </g>
  <!-- S3 Vectors -->
  <g transform="translate(1220,665)">
    <rect x="-36" y="-36" width="72" height="72" fill="#7AA116"/>
    <path class="glyph" d="M-18,-14 h36 l-5,32 h-26 z M-18,-14 q18,9 36,0"/>
    <circle cx="-6" cy="4" r="2.5" fill="#fff"/><circle cx="4" cy="0" r="2.5" fill="#fff"/><circle cx="2" cy="11" r="2.5" fill="#fff"/>
    <text y="56" text-anchor="middle" class="n">Amazon S3 Vectors</text>
    <text y="73" text-anchor="middle" class="s">kho vector</text>
  </g>
  <!-- S3 docs -->
  <g transform="translate(360,665)">
    <rect x="-36" y="-36" width="72" height="72" fill="#7AA116"/>
    <path class="glyph" d="M-18,-14 h36 l-5,32 h-26 z M-18,-14 q18,9 36,0"/>
    <text y="56" text-anchor="middle" class="n">Amazon S3</text>
    <text y="73" text-anchor="middle" class="s">tài liệu PDF (private)</text>
  </g>
  <!-- Titan -->
  <g transform="translate(1220,400)">
    <rect x="-36" y="-36" width="72" height="72" fill="#01A88D"/>
    <path class="glyph" d="M-20,-16 h12 M-20,-6 h18 M-20,4 h10 M-20,14 h16 M4,0 h16 M14,-8 l8,8 -8,8"/>
    <text y="56" text-anchor="middle" class="n">Titan Text Embeddings V2</text>
    <text y="73" text-anchor="middle" class="s">văn bản → vector</text>
  </g>

  <!-- ===== Question flow (1-6) ===== -->
  <polyline class="q" points="140,282 240,282 240,170 322,170"/>
  <rect class="lb" x="214" y="196" width="104" height="20"/><text x="218" y="211" class="l">1. Mở trang web</text>

  <polyline class="q" points="140,318 240,318 240,400 322,400"/>
  <rect class="lb" x="214" y="342" width="98" height="38"/>
  <text x="218" y="357" class="l">2. POST /ask</text><text x="218" y="373" class="lg">{question}</text>

  <line class="q" x1="398" y1="400" x2="612" y2="400"/>
  <rect class="lb" x="430" y="381" width="140" height="20"/><text x="434" y="396" class="l">3. Gọi hàm Lambda</text>

  <line class="q" x1="688" y1="400" x2="912" y2="400"/>
  <rect class="lb" x="704" y="381" width="190" height="20"/><text x="708" y="396" class="l">4. retrieve_and_generate</text>

  <line class="q" x1="988" y1="388" x2="1182" y2="388"/>
  <rect class="lb" x="1000" y="366" width="150" height="18"/><text x="1004" y="380" class="l">5a. Mã hoá câu hỏi</text>
  <line class="i" x1="988" y1="414" x2="1182" y2="414"/>
  <rect class="lb" x="1000" y="420" width="160" height="18"/><text x="1004" y="434" class="l">C. Mã hoá từng đoạn</text>

  <polyline class="q" points="950,362 950,170 1182,170"/>
  <rect class="lb" x="970" y="150" width="190" height="20"/><text x="974" y="165" class="l">6. Sinh câu trả lời + nguồn</text>

  <!-- support links -->
  <line class="d" x1="650" y1="362" x2="650" y2="252"/>
  <text x="658" y="290" class="lg">ghi log</text>
  <line class="d" x1="650" y1="484" x2="650" y2="572"/>
  <text x="658" y="510" class="lg">quyền gọi Bedrock</text>

  <!-- ===== Ingestion flow (A-D) ===== -->
  <line class="i" x1="140" y1="665" x2="322" y2="665"/>
  <rect class="lb" x="160" y="644" width="120" height="20"/><text x="164" y="659" class="l">A. Upload PDF</text>

  <polyline class="i" points="398,690 925,690 925,486"/>
  <rect class="lb" x="760" y="695" width="150" height="20"/><text x="764" y="710" class="l">B. Sync: đọc &amp; chia nhỏ</text>

  <polyline class="q" points="975,484 975,665 1182,665"/>
  <rect class="lb" x="992" y="644" width="176" height="20"/><text x="996" y="659" class="l">5b. Tìm 5 đoạn gần nhất</text>

  <line class="i" x1="1220" y1="486" x2="1220" y2="627"/>
  <rect class="lb" x="1228" y="540" width="106" height="20"/><text x="1232" y="555" class="l">D. Lưu vector</text>

  <!-- Legend -->
  <g transform="translate(230,770)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#232F3E" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="50" y="4" class="lg">Luồng hỏi đáp (1–6); kết quả trả ngược về trình duyệt</text>
    <line x1="430" y1="0" x2="470" y2="0" stroke="#6b7785" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#g)"/>
    <text x="480" y="4" class="lg">Luồng nạp tài liệu (A–D), chạy khi Sync</text>
    <line x1="800" y1="0" x2="840" y2="0" stroke="#6b7785" stroke-width="1.4" stroke-dasharray="2 4"/>
    <text x="850" y="4" class="lg">Giám sát và phân quyền</text>
  </g>
</svg>
