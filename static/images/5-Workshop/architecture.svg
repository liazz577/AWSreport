<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker>
    <style>
      .t{font-size:14px;font-weight:700;fill:#232F3E}
      .s{font-size:11.5px;fill:#5f6b7a}
      .lbl{font-size:11.5px;fill:#232F3E;font-weight:600}
      .box{fill:#fff;stroke-width:2;rx:8}
      .flow{stroke:#232F3E;stroke-width:1.8;fill:none;marker-end:url(#ar)}
      .ing{stroke:#5f6b7a;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#ag)}
    </style>
  </defs>
  <rect width="1100" height="470" fill="#ffffff"/>
  <!-- AWS cloud boundary -->
  <rect x="160" y="20" width="925" height="395" rx="10" fill="#f7f9fa" stroke="#232F3E" stroke-width="1.5"/>
  <text x="178" y="44" class="t">AWS Cloud · us-east-1</text>

  <!-- User -->
  <rect x="20" y="95" width="115" height="80" rx="8" fill="#fff" stroke="#232F3E" stroke-width="2"/>
  <text x="77" y="130" text-anchor="middle" class="t">Student</text>
  <text x="77" y="150" text-anchor="middle" class="s">web browser</text>

  <!-- Top row -->
  <rect class="box" x="185" y="95" width="140" height="80" stroke="#3F8624"/>
  <text x="255" y="128" text-anchor="middle" class="t">Amazon S3</text>
  <text x="255" y="148" text-anchor="middle" class="s">static website</text>

  <rect class="box" x="370" y="95" width="140" height="80" stroke="#8C4FFF"/>
  <text x="440" y="128" text-anchor="middle" class="t">API Gateway</text>
  <text x="440" y="148" text-anchor="middle" class="s">HTTP API · POST /ask</text>

  <rect class="box" x="555" y="95" width="140" height="80" stroke="#ED7100"/>
  <text x="625" y="128" text-anchor="middle" class="t">AWS Lambda</text>
  <text x="625" y="148" text-anchor="middle" class="s">studymate-ask</text>

  <rect class="box" x="740" y="95" width="140" height="80" stroke="#01A88D"/>
  <text x="810" y="122" text-anchor="middle" class="t">Bedrock</text>
  <text x="810" y="140" text-anchor="middle" class="t">Knowledge Base</text>
  <text x="810" y="158" text-anchor="middle" class="s">studymate-kb</text>

  <rect class="box" x="925" y="95" width="140" height="80" stroke="#01A88D"/>
  <text x="995" y="128" text-anchor="middle" class="t">Amazon Nova Lite</text>
  <text x="995" y="148" text-anchor="middle" class="s">writes the answer</text>

  <!-- Bottom row -->
  <rect class="box" x="185" y="285" width="140" height="80" stroke="#E7157B"/>
  <text x="255" y="318" text-anchor="middle" class="t">CloudWatch</text>
  <text x="255" y="338" text-anchor="middle" class="s">logs &amp; metrics</text>

  <rect class="box" x="370" y="285" width="140" height="80" stroke="#DD344C"/>
  <text x="440" y="318" text-anchor="middle" class="t">IAM · Budgets</text>
  <text x="440" y="338" text-anchor="middle" class="s">permissions &amp; cost alerts</text>

  <rect class="box" x="555" y="285" width="140" height="80" stroke="#3F8624"/>
  <text x="625" y="318" text-anchor="middle" class="t">Amazon S3</text>
  <text x="625" y="338" text-anchor="middle" class="s">source PDFs (private)</text>

  <rect class="box" x="740" y="285" width="140" height="80" stroke="#01A88D"/>
  <text x="810" y="312" text-anchor="middle" class="t">Titan Text</text>
  <text x="810" y="330" text-anchor="middle" class="t">Embeddings V2</text>
  <text x="810" y="348" text-anchor="middle" class="s">text → vectors</text>

  <rect class="box" x="925" y="285" width="140" height="80" stroke="#3F8624"/>
  <text x="995" y="318" text-anchor="middle" class="t">S3 Vectors</text>
  <text x="995" y="338" text-anchor="middle" class="s">vector store</text>

  <!-- Question flow -->
  <path class="flow" d="M135,150 L183,150"/>
  <text x="139" y="142" class="lbl">1 load</text>
  <path class="flow" d="M100,95 C100,52 440,52 440,93"/>
  <text x="192" y="86" class="lbl">2 POST /ask {question}</text>
  <path class="flow" d="M510,135 L553,135"/>
  <text x="522" y="127" class="lbl">3</text>
  <path class="flow" d="M695,135 L738,135"/>
  <text x="707" y="127" class="lbl">4</text>
  <path class="flow" d="M832,177 L955,283"/>
  <text x="900" y="222" class="lbl">5 search</text>
  <path class="flow" d="M880,135 L923,135"/>
  <text x="892" y="127" class="lbl">6</text>
  <path class="ing" d="M600,177 L300,283"/>
  <text x="400" y="222" class="s">logs</text>

  <!-- Ingestion flow -->
  <path class="ing" d="M695,325 L738,325"/>
  <path class="ing" d="M880,325 L923,325"/>
  <path class="ing" d="M650,285 L765,177"/>
  <text x="700" y="268" class="s">Sync: chunk → embed → store</text>

  <!-- Legend -->
  <line x1="185" y1="440" x2="225" y2="440" stroke="#232F3E" stroke-width="1.8"/>
  <text x="233" y="444" class="s">Question flow (1–6), answer returns the same way</text>
  <line x1="560" y1="440" x2="600" y2="440" stroke="#5f6b7a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="608" y="444" class="s">Document ingestion (Sync) and logging</text>
</svg>
